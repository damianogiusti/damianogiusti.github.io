career-profile:
    title: Chi sono
    summary: |
      Sono un mobile engineer senior con oltre dieci anni di esperienza nello sviluppo di app
      Android — e, più di recente, di soluzioni cross-platform Android e iOS con Kotlin
      Multiplatform. Oggi lavoro su wearable di livello medicale in Empatica, curando le
      funzionalità end to end, dal BLE e dalla data pipeline fino alla UI, e costruendo la
      piattaforma condivisa e il tooling su cui le app si appoggiano. Tengo profondamente
      alla Clean Architecture, al testing e a quei piccoli dettagli che rendono un'app veloce
      e affidabile — e mi piace affrontare problemi difficili e aiutare le persone intorno a me
      a crescere mentre lo faccio.

