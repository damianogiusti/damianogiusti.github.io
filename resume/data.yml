career-profile:
    title: About me
    summary: |
      I'm a senior mobile engineer with over a decade building Android apps — and, more
      recently, cross-platform Android and iOS with Kotlin Multiplatform. Today I work on
      medical-grade wearables at Empatica, owning features end to end from BLE and the data
      pipeline up to the UI, and building the shared platform and tooling the apps sit on.
      I care deeply about clean architecture, testing, and the small details that make an app
      feel fast and reliable — and I like taking on hard problems and helping the people
      around me get better while I do it.

